# Evals de conversación del front (Jarvis). `judge` es un criterio en lenguaje natural que solo
# se evalúa con TONY_EVALS=1 (modelo claude-haiku como juez).
- id: saludo
  turns:
    - user: Hola, Jarvis.
      expect:
        delegates: false
        judge: Es un saludo educado en español; puede mencionar la hora actual o sus capacidades y tratar al usuario de "señor" (es el tratamiento configurado), pero no afirma haber realizado tareas ni inventa datos sobre el usuario.
- id: hora
  turns:
    - user: ¿Qué hora es?
      expect:
        delegates: false
        reply_contains: [":"]
        judge: Indica una hora concreta (formato HH:MM) de forma directa, sin pedir permisos, sin delegar y sin inventar citas o eventos.
- id: listar-notas
  turns:
    - user: Lista mis notas, por favor.
      expect:
        delegates: true
        reply_contains: [a.md]
- id: recordar-preferencia
  turns:
    - user: Recuerda que prefiero respuestas cortas.
      expect:
        delegates: false
    - user: ¿Qué preferencia acabo de pedirte?
      expect:
        delegates: false
        reply_contains: [cortas]
