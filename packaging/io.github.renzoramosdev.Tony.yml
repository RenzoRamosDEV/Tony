# Local Flatpak build of Tony (see README «Flatpak»). Not for Flathub: the Python
# dependencies are downloaded at build time, pinned by hash in packaging/requirements.txt.
id: io.github.renzoramosdev.Tony
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
command: tony
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/pkgconfig
  - "*.la"
modules:
  - name: portaudio
    config-opts:
      - --disable-static
      - --without-jack
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0

  - name: tony
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-deps --require-hashes -r packaging/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - pip3 install --prefix=/app --no-deps .
      - install -Dm644 packaging/io.github.renzoramosdev.Tony.desktop /app/share/applications/io.github.renzoramosdev.Tony.desktop
      - install -Dm644 packaging/io.github.renzoramosdev.Tony.svg /app/share/icons/hicolor/scalable/apps/io.github.renzoramosdev.Tony.svg
    sources:
      - type: dir
        path: ..
