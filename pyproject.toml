[project]
name = "tony"
version = "1.0.0rc0"
description = "Asistente personal local con dos agentes: Jarvis (front) y Viernes (worker)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.174",
    "mcp>=1.23,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "watchfiles>=1,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
web = []
voice = []

[project.scripts]
tony = "tony.apps.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mutmut>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tony"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
markers = ["evals: pruebas con modelo real (solo con TONY_EVALS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mutmut]
source_paths = ["tony/"]
also_copy = ["agents/"]
# The stdio MCP subprocess cannot start inside mutmut's copied tree, so the integration
# tests that drive it (and the module they cover) are left out of mutation analysis.
do_not_mutate = ["tony/core/mcp/manager.py"]
pytest_add_cli_args = [
    "--ignore=tests/core/test_mcp_manager.py",
    "--ignore=tests/fakes/test_fake_mcp_server.py",
]
