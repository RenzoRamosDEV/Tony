[project]
name = "tony"
version = "2.0.0a0"
description = "Asistente personal local con agentes Jarvis, Viernes y Edith."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "claude-agent-sdk==0.2.176",
    "mcp==2.3.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyside6>=6.12.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "watchfiles>=1.3.0",
]

[project.scripts]
tony = "tony.apps.cli.main:app"

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "numpy>=2.5.4",
    "silero-vad>=6.2.3",
    "sounddevice>=0.5.6",
    "torch>=2.15.0",
]
desktop = [
    "desktop-notifier>=6.2.0",
    "pynput>=1.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tony"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
qt_api = "pyside6"
testpaths = ["tests"]
markers = [
    "evals: pruebas con modelo real (solo con TONY_EVALS=1)",
    "voice: pruebas con los motores de voz reales (uv run pytest -m voice)",
]
addopts = "-m 'not voice'"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".claude", "apm_modules", "openspec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-qt>=4.5.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint.isort]
known-first-party = ["tony", "tests"]

[tool.mutmut]
source_paths = ["tony/"]
also_copy = ["agents/", "evals/"]
# Mutants that hang a stdio MCP server otherwise wait 15x the slowest covering test.
timeout_multiplier = 3.0
# The live Claude Agent SDK call is only exercised by the evals-marked real-model test.
# Desktop widgets and app.py are pure Qt layout and glue: behaviour lives in the mutated
# presenters, and widget mutants are equivalent or crash-only under offscreen Qt.
# config/watcher.py is thin watchfiles glue covered by one real-filesystem test.
# Voice engines and desktop system adapters are thin engine/OS glue exercised only by
# voice-marked or offscreen tests: their logic lives in the mutated pure modules.
do_not_mutate = [
    "tony/core/guard/claude_wording.py",
    "tony/core/config/watcher.py",
    "tony/apps/desktop/widgets/*",
    "tony/apps/desktop/app.py",
    "tony/core/voice/engines/*",
    "tony/apps/desktop/system/*",
]
# Repository layout checks read files outside the copied tree and cover no mutated code.
# A mutant that deadlocks an MCP or asyncio test idles without using CPU, which mutmut's
# CPU-time limit never catches: the thread method ends that mutant's process instead.
pytest_add_cli_args = [
    "-p", "no:cacheprovider",
    "--timeout=20",
    "--timeout-method=thread",
    "--ignore=tests/test_layout.py",
    "--ignore=tests/test_optional_imports.py",
    "--ignore=tests/test_packaging.py",
    "--ignore=tests/test_readme.py",
    "--ignore=tests/test_gitignore.py",
    "--ignore=tests/core/config/test_bundled_config.py",
    "--ignore=tests/fakes/test_fake_fs_server.py",
]
