[project]
name = "tony"
version = "1.0.0rc0"
description = "Asistente personal local con dos agentes: Jarvis (front) y Viernes (worker)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claude-agent-sdk==0.2.174",
    "mcp>=2.3,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "watchfiles>=1,<2",
    "python-dotenv>=1,<2",
    "litellm>=1.106.6",
]

[project.optional-dependencies]
web = ["fastapi>=0.162,<1", "uvicorn[standard]>=0.30,<1", "websockets>=12,<16"]
voice = [
    "faster-whisper>=1.2,<2",
    "kokoro>=0.9.4,<1",
    "piper-tts>=1.8,<2",
    "silero-vad>=6,<7",
    "onnxruntime>=1.17,<2",
    "numpy>=1.26,<3",
    "soundfile>=0.12,<1",
    "torch>=2.5,<3",
]

[project.scripts]
tony = "tony.apps.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mutmut>=3",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tony"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
markers = [
    "evals: pruebas con modelo real (solo con TONY_EVALS=1)",
    "voice: pruebas con los motores de voz reales (uv run pytest -m voice)",
    "litellm: pruebas con un proveedor real vía LiteLLM (uv run pytest -m litellm)",
]
addopts = "-m 'not voice and not litellm'"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", ".claude", "apm_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mutmut]
source_paths = ["tony/"]
also_copy = ["agents/"]
# The stdio MCP subprocess cannot start inside mutmut's copied tree, so the integration
# tests that drive it (and the module they cover) are left out of mutation analysis.
do_not_mutate = ["tony/core/mcp/manager.py"]
pytest_add_cli_args = [
    "--ignore=tests/core/test_mcp_manager.py",
    "--ignore=tests/fakes/test_fake_mcp_server.py",
    "--deselect=tests/fakes/test_doubles.py::test_fake_filesystem_server_exposes_five_tools_over_the_given_directory",
    "--deselect=tests/apps/test_cli_mcp.py::test_add_stdio_server_connects_and_reports_tools",
    "--deselect=tests/apps/test_cli_mcp.py::test_add_with_a_failing_connection_keeps_the_entry_and_warns",
    "--deselect=tests/apps/test_cli_mcp.py::test_list_connects_and_shows_state_tools_allow_and_confirm",
    "--deselect=tests/apps/test_cli_mcp.py::test_list_with_a_broken_server_shows_error_and_exits_0",
    "--deselect=tests/apps/test_cli_doctor.py::test_healthy_installation_passes_offline",
    "--deselect=tests/apps/test_cli_doctor.py::test_induced_failures_are_reported_with_hints_and_exit_1",
    "--deselect=tests/apps/test_cli_doctor.py::test_doctor_without_offline_probes_the_model",
]
