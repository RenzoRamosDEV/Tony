# Tony global settings. Every key is optional; missing keys take these defaults.
# Unknown keys are rejected.

front: jarvis          # front agent folder (agents/<name>/)
worker: viernes        # worker agent folder
guard: edith           # guard agent folder
reply_mode: auto       # auto | voice | text | both

# Model aliases used by agents/<name>/agent.md (`model:`), resolved at run time.
models:
  claude-haiku: claude-haiku-5-5
  claude-sonnet: claude-sonnet-5-5

voice:
  stt: faster-whisper/small
  vad: silero
  tts_default: kokoro/em_alex

desktop:
  hotkey: "Super+J"
  tray: true
  theme: system
