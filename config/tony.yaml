# Configuración global de Tony. Todos los campos son opcionales: los valores
# comentados son los que se aplican por defecto cuando no se indican.
#
# front: jarvis
# worker: viernes
reply_mode: voice             # auto | voice | text | both; fijado a voice, bloqueado en /api/settings y el tool del agente
# models:
#   claude-haiku: claude-haiku-5-5
#   claude-sonnet: claude-sonnet-5-5
voice:
  stt: faster-whisper/base      # small: más preciso, ~3 veces más lento
  tts: kokoro/em_alex*0.6+em_santa*0.4?speed=0.94   # KOKORO-MEZCLA-GRAVE-LATINO: más grave, es-419
#   # Alias de voz: motor/voz[?speed=0.5..1.5&lang=es-419|es]; lang solo en Kokoro.
#   # Alternativas (escúchalas en samples/voices/ con scripts/voice_samples.py):
#   #   tts: piper/es_MX-ald-medium?speed=0.95
#   #   tts: kokoro/em_alex?speed=0.94
#   #   tts: kokoro/ef_dora?lang=es                       # voz anterior (peninsular)
#   vad: silero
#   end_silence_ms: 500           # silencio que cierra una intervención (300–1500)
#   barge_in: true                # interrumpir a Tony hablando encima
#   barge_in_threshold: 0.8       # umbral de habla mientras Tony habla (0.5–0.99)
#   barge_in_min_speech_ms: 280   # habla mínima para interrumpir (150–1000)
#   cpu_threads: null             # hilos de STT/TTS; null = mitad de los núcleos lógicos
#   acknowledgements:             # acuses al delegar una tarea (1–10 frases, ≤ 60 caracteres)
#     - Un momento, señor.
#     - Enseguida, señor.
#     - Ahora mismo lo reviso, señor.
# channels: [cli, web]
# web:                        # tony web; --port y --host de la línea de comandos tienen prioridad
#   port: 8787
#   host: 127.0.0.1           # fuera de loopback solo con --allow-remote
# limits:
#   tool_timeout_s: 20
#   task_timeout_s: 300
#   confirm_timeout_s: 60
#   mcp_connect_timeout_s: 10
#   token_alert: 50000
#   memory_max_lines: 200
